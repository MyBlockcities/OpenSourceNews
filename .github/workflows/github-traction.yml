name: GitHub Traction Scoring

on:
  schedule:
    # After daily (~07:17 UTC); Monday also refreshes top_this_week.
    - cron: "47 8 * * *"
  workflow_dispatch:
    inputs:
      offline:
        description: "Skip GitHub API (placeholder scores)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: github-traction
  cancel-in-progress: false

jobs:
  score-repos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run GitHub traction pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.offline }}" = "true" ]; then
            EXTRA="--offline"
          fi
          python pipelines/github_traction.py $EXTRA

      - name: Commit traction outputs
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions-bot@users.noreply.github.com"
          git add outputs/github_traction/** || true
          git commit -m "GitHub traction scores for $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push && exit 0
            echo "Push failed on attempt ${attempt}; retrying..."
            sleep 5
          done
          exit 1
