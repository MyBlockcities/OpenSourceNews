name: Daily Research Briefing
on:
  schedule:
    # 07:17 UTC avoids minute-zero scheduler congestion (~01:17 MDT / ~00:17 MST).
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      no_commit:
        description: "Run the pipeline without committing generated outputs."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write # Needed to commit the report back to the repo

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  run-research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate source registry
        run: |
          python scripts/validate_sources.py
          python scripts/compile_feeds_compat.py --check

      - name: Run research pipeline
        env:
          # Collection-first: GitHub collects; Agency/Hermes enrich privately.
          # Do not set QDRANT_API_KEY, SUPABASE_SECRET_KEY, or SUPABASE_SERVICE_ROLE_KEY here.
          COLLECT_ONLY: "1"
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'ollama' }}
          OPENROUTER_API_KEY: ${{ (vars.LLM_PROVIDER == 'openrouter' || vars.LLM_PROVIDER == 'rotating') && secrets.OPENROUTER_API_KEYS || '' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          OPENROUTER_MAX_REQUESTS_PER_RUN: ${{ vars.OPENROUTER_MAX_REQUESTS_PER_RUN || '0' }}
          OPENROUTER_MIN_INTERVAL_SECONDS: ${{ vars.OPENROUTER_MIN_INTERVAL_SECONDS || '0' }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YT_API_KEY }}
          # NCBI: raises PubMed from 3 to 10 req/sec and stops the nightly 429s.
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          HOST_MIN_INTERVAL_SECONDS: ${{ vars.HOST_MIN_INTERVAL_SECONDS || '0.7' }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          MAILAROO_API_KEY: ${{ secrets.MAILAROO_API_KEY }}
          MAILAROO_TO_EMAIL: ${{ secrets.MAILAROO_TO_EMAIL }}
          ACADEMY_INGEST_URL: ${{ secrets.ACADEMY_INGEST_URL }}
          ACADEMY_INGEST_BEARER_TOKEN: ${{ secrets.ACADEMY_INGEST_TOKEN }}
          GODSEYE_INGEST_URL: ${{ secrets.GODSEYE_INGEST_URL }}
          GODSEYE_INGEST_BEARER_TOKEN: ${{ secrets.GODSEYE_INGEST_TOKEN }}
          AGENCY_INGEST_URL: ${{ secrets.AGENCY_INGEST_URL }}
          AGENCY_INGEST_BEARER_TOKEN: ${{ secrets.AGENCY_INGEST_BEARER_TOKEN }}
        run: python pipelines/daily_run.py

      - name: Build mission briefs
        run: python pipelines/mission_briefs.py

      - name: Extract atoms + public intelligence sidecars
        env:
          ATOMS_LLM: ${{ vars.ATOMS_LLM || '0' }}
          ATOM_LLM: ${{ vars.ATOMS_LLM || '0' }}
          OPENROUTER_API_KEY: ${{ vars.ATOMS_LLM == '1' && secrets.OPENROUTER_API_KEYS || '' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          LLM_PROVIDER: openrouter
        run: python scripts/export_atoms.py

      - name: Identify public document links
        run: python scripts/extract_document_links.py

      - name: Export embedding-ready JSONL
        run: python scripts/export_embedding_ready.py

      - name: Build IntelligenceEnvelope
        run: python scripts/export_intelligence_envelope.py

      - name: Build report manifest
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/build_report_manifest.py

      - name: Commit and push report
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.no_commit != 'true' }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions-bot@users.noreply.github.com"
          git add outputs/daily/*.json outputs/transcripts/*.json outputs/briefs \
              outputs/atoms/** outputs/embedding_ready/** outputs/topics/** \
              outputs/entities/** outputs/entity_pages/** outputs/consensus/** \
              outputs/source_trust/** outputs/document_leads/** outputs/envelopes/** \
              outputs/source_health/** \
              outputs/manifests/latest.json || true
          git commit -m "Daily intelligence report for $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push && exit 0
            echo "Push failed on attempt ${attempt}; retrying..."
            sleep 5
          done
          exit 1

      - name: Enforce source-health thresholds
        env:
          SOURCE_HEALTH_MAX_FAILED_PCT: ${{ vars.SOURCE_HEALTH_MAX_FAILED_PCT || '10' }}
          SOURCE_HEALTH_MAX_FAILED_ABS: ${{ vars.SOURCE_HEALTH_MAX_FAILED_ABS || '25' }}
        run: python scripts/check_source_health.py

      - name: Notify on failure
        if: failure()
        env:
          MAILAROO_API_KEY: ${{ secrets.MAILAROO_API_KEY }}
          MAILAROO_TO_EMAIL: ${{ secrets.MAILAROO_TO_EMAIL }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -n "$MAILAROO_API_KEY" ] && [ -n "$MAILAROO_TO_EMAIL" ]; then
            DATE=$(date -u +%Y-%m-%d)
            python3 -c "
          import sys, os
          sys.path.insert(0, '.')
          from services.mailaroo_emailer import send_text_email
          repo = os.environ['REPO']
          run_id = os.environ['RUN_ID']
          date = os.environ.get('DATE', 'unknown')
          send_text_email(
              body=f'The Daily Research Briefing pipeline failed. Check GitHub Actions for details: https://github.com/{repo}/actions/runs/{run_id}',
              subject=f'[OpenSourceNews] Daily pipeline FAILED - {date}'
          )
          " || echo "Failed to send failure notification email"
          else
            echo "No email credentials configured — skipping failure notification"
          fi
