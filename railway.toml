# Railway: this repo powers TWO services (static Vite UI + Flask API).
#
# Do NOT set [build].builder or [deploy].startCommand here — a single
# railway.toml applies to every service and will fight per-service Dockerfiles.
#
# Per-service variables (required):
#   • OpenSourceNews (frontend):
#       RAILWAY_DOCKERFILE_PATH=Dockerfile.frontend
#       VITE_API_BASE_URL=https://opensourcenewsapi-production.up.railway.app
#       Health check: /
#   • opensourcenews_api:
#       RAILWAY_DOCKERFILE_PATH=Dockerfile.api
#       OPEN_SOURCE_NEWS_CORS_ORIGINS=https://opensourcenews.up.railway.app
#       Start (if needed): python3 api/script_generator.py
#       Health check: /api/health
#
# Why the frontend failed after the API fix:
#   Removing global Nixpacks let Railpack auto-detect Python (requirements.txt)
#   with no start command. Each service must pin its own Dockerfile.
