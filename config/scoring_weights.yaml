# Composite traction weights (public). Hermes may multiply by private relevance later.
# quality_score < quality_gate → excluded from top lists.

weights:
  momentum: 0.25
  quality: 0.25
  community: 0.20
  adoption: 0.20
  # Reserved slot (0.10) for Hermes private relevance — not applied here.

quality_gate: 60

# Sub-metric hints (0–100 scale inputs before weighting).
momentum_signals:
  - stars_delta_7d
  - forks_delta_7d
  - commits_delta_7d
quality_signals:
  - has_license
  - has_ci
  - open_issues_health
  - docs_present
community_signals:
  - contributors_active
  - pr_merge_rate
  - discussion_activity
adoption_signals:
  - stars_total
  - dependents_proxy
  - downstream_mentions
